<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Horario de Clases - Asier Lozano Matienzo</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);
--bg:#f8fafc;--panel:#fff;--bd:#e2e8f0;--tx:#0f172a;--mut:#64748b;--acc:#4f46e5;--soft:#f1f5f9;
--cbs:90%;--cbl:96%;--cds:75%;--cdl:85%;--cts:60%;--ctl:22%}
:root[data-mode=dark]{color-scheme:dark;--bg:#0f172a;--panel:#1e293b;--bd:#334155;--tx:#f1f5f9;--mut:#94a3b8;--acc:#818cf8;--soft:#273449;
--cbs:45%;--cbl:16%;--cds:40%;--cdl:28%;--cts:80%;--ctl:88%}
:root[data-mode=light]{color-scheme:light}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*,*::before,*::after{box-sizing:inherit}
body{margin:0;background:var(--bg);color:var(--tx);font:14px/1.4 Inter,system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;transition:background .2s,color .2s}
.app{display:flex;min-height:100vh}
aside{width:20rem;flex-shrink:0;background:var(--panel);border-right:1px solid var(--bd);padding:1.5rem;display:flex;flex-direction:column;justify-content:space-between}
main{flex:1;min-width:0;padding:2rem}
h1{margin:.1rem 0;font-size:1.5rem}h2{margin:0;font-size:1rem}
small,.mut{color:var(--mut);font-size:12px}
.eyebrow{font-size:12px;font-weight:600;letter-spacing:.06em;text-transform:uppercase;color:var(--acc)}
.panel{background:var(--panel);border:1px solid var(--bd);border-radius:1rem}
header.panel{padding:1.5rem;margin-bottom:1.5rem;display:flex;justify-content:space-between;align-items:center;gap:1rem;flex-wrap:wrap}
button,input{font:inherit;color:inherit}
button{cursor:pointer}
.btn{border:0;border-radius:.75rem;padding:.6rem 1rem;font-size:12px;font-weight:500;background:var(--soft)}
.btn.pri{background:#4f46e5;color:#fff}
.btn:hover{filter:brightness(.95)}
.tools{display:flex;gap:1rem;justify-content:space-between;align-items:center;flex-wrap:wrap;margin-bottom:1.5rem}
input[type=search]{width:20rem;max-width:100%;padding:.55rem .9rem;background:var(--panel);border:1px solid var(--bd);border-radius:.75rem;font-size:12px}
input[type=search]:focus{outline:2px solid var(--acc);outline-offset:-1px}
#filters{display:flex;gap:.25rem;overflow-x:auto;max-width:100%}
#filters button{border:0;border-radius:.5rem;padding:.4rem .75rem;font-size:12px;font-weight:500;background:var(--panel);white-space:nowrap}
#filters button.on{background:#4f46e5;color:#fff}
.wrap{overflow-x:auto;overflow:hidden auto}
.tbl{overflow-x:auto}
table{width:100%;min-width:760px;border-collapse:collapse;text-align:left}
th{padding:.75rem;background:var(--soft);font-size:12px;text-transform:uppercase;letter-spacing:.05em;color:var(--mut)}
td{padding:.5rem;border-top:1px solid var(--bd);vertical-align:top;font-size:12px}
td.day-col{height:1px}
td.hr,th.hr{width:7rem;text-align:center;font-weight:700;background:var(--soft);border-right:1px solid var(--bd)}
.stack{display:flex;flex-direction:column;gap:.5rem;height:100%}
.today{background:color-mix(in srgb,var(--acc) 8%,transparent)}
.card{--h:0;position:relative;padding:.5rem .65rem;border:1px solid;border-radius:.75rem;cursor:pointer;transition:all .2s;
background:hsl(var(--h) var(--cbs) var(--cbl));border-color:hsl(var(--h) var(--cds) var(--cdl));color:hsl(var(--h) var(--cts) var(--ctl))}
.card.big{flex:1;padding:.75rem}
.card b{display:block}.tm{font-size:10px;font-weight:600;opacity:.75}.tc{font-size:11px;opacity:.8;margin-top:.15rem}
.card:hover{transform:translateY(-2px)}
.card.hl{box-shadow:0 0 0 3px var(--acc);transform:scale(1.02);z-index:2}
.card.now{outline:2px solid #16a34a;outline-offset:1px}
.card.now::after{content:"AHORA";position:absolute;top:-8px;right:8px;background:#16a34a;color:#fff;font-size:9px;font-weight:700;letter-spacing:.05em;padding:1px 6px;border-radius:999px}
.rec.now td{background:color-mix(in srgb,#16a34a 18%,var(--soft));color:var(--tx)}
.card.ot{opacity:.3}.card.nm{opacity:.2;filter:grayscale(1)}
.card:focus-visible{outline:2px solid var(--acc);outline-offset:2px}
.static{cursor:default}.static:hover{transform:none}
.rec td{background:var(--soft);text-align:center;font-weight:600;color:var(--mut);padding:.4rem;font-size:11px}
.rec td+td{text-transform:uppercase;letter-spacing:.1em;font-size:10px;color:var(--acc)}
details.prof{border:1px solid var(--bd);border-radius:.75rem;overflow:hidden;margin-bottom:.75rem}
details.prof summary{list-style:none;cursor:pointer;padding:.85rem;display:flex;justify-content:space-between;align-items:center;gap:.5rem}
details.prof summary::-webkit-details-marker{display:none}
details.prof summary:hover{background:var(--soft)}
details.prof summary b{display:block;font-size:14px}
details.prof svg{transition:transform .2s;flex-shrink:0;color:var(--mut)}
details.prof[open] svg{transform:rotate(180deg)}
.pbody{padding:.75rem;border-top:1px solid var(--bd);display:grid;gap:.5rem}
.pbody .tc{font-size:11px}
.total{margin-top:1.5rem;padding-top:1.5rem;border-top:1px solid var(--bd)}
.total div{display:flex;justify-content:space-between;font-weight:700}
[data-mode=dark] .lightonly,[data-mode=light] .darkonly{display:none}
@media(max-width:1023px){.app{flex-direction:column}main{order:-1;padding:1rem}aside{width:auto;border-right:0;border-top:1px solid var(--bd)}}
@media print{.no-print{display:none!important}aside{display:none}main{padding:0}body{background:#fff}td.day-col{height:auto}}
</style>
</head>
<body>
<div class="app">
<main>
  <header class="panel">
    <div>
      <div class="eyebrow">I.E.S. Donoso Cortés (Don Benito)</div>
      <h1>Horario de Clases</h1>
      <small>Alumno: <b style="color:var(--tx)">Asier Lozano Matienzo</b></small>
    </div>
    <div class="no-print" style="display:flex;gap:.75rem">
      <button class="btn" id="themeBtn" aria-label="Cambiar tema claro/oscuro"><span class="lightonly">🌙</span><span class="darkonly">☀️</span></button>
      <button class="btn pri" onclick="window.print()">🖨️ Imprimir horario</button>
    </div>
  </header>

  <div class="tools no-print">
    <input type="search" id="q" placeholder="Buscar asignatura o profesor..." aria-label="Buscar">
    <div id="filters"></div>
  </div>

  <div class="panel tbl" style="overflow:auto">
    <table>
      <thead><tr id="thead"></tr></thead>
      <tbody id="tb"></tbody>
    </table>
  </div>
</main>

<aside class="no-print">
  <div>
    <div style="display:flex;gap:.6rem;align-items:center;margin-bottom:1.5rem">
      <span style="font-size:1.4rem">🧑‍🏫</span>
      <div><h2>Profesorado</h2><small>Haz clic para desplegar horas</small></div>
    </div>
    <div id="profs"></div>
  </div>
  <div class="total">
    <small style="font-weight:600;text-transform:uppercase;letter-spacing:.06em">Resumen total</small>
    <div style="margin-top:.5rem"><span>Total lectivo:</span><span id="total"></span></div>
  </div>
</aside>
</div>

<script>
const DAYS=['Lunes','Martes','Miércoles','Jueves','Viernes'],DS=['Lun','Mar','Mié','Jue','Vie'];
const S=['8:30','9:25','10:40','11:35','12:40','13:35'],E=['9:25','10:20','11:35','12:30','13:35','14:30'];
const TEACH={francisca:['María Francisca Manchado','Mª Francisca Manchado'],manuel:['Manuel Manchado Moraga','Manuel Manchado'],soledad:['María Soledad Casado Sanz','Mª Soledad Casado'],saul:['Saúl González','Saúl González']};
// [nombre completo, nombre corto, profesor, tono de color]
const SUB={
 montaje:['Montaje y Mantenimiento','Montaje y Mantenimiento','francisca',0],
 proyecto:['Proyecto Intermodular','Proyecto Intermodular','francisca',175],
 sistemas:['Sistemas Operativos en Red','Sistemas Operativos','manuel',210],
 ipe:['IPE II','IPE II','manuel',345],
 sostenibilidad:['Sostenibilidad Aplicada','Sostenibilidad','manuel',130],
 web:['Aplicaciones Web','Aplicaciones Web','soledad',160],
 optativa:['Programación','Programación','soledad',270],
 digitalizacion:['Digitalización Aplicada','Digitalización','soledad',40],
 redes:['Servicios en Red','Servicios en Red','saul',245]};
// 6 periodos por día: [8:30, 9:25, 10:40, 11:35, 12:40, 13:35]
const SCH=[
 ['montaje','montaje','optativa','sistemas','ipe','redes'],
 ['sistemas','sistemas','redes','redes','web','proyecto'],
 ['montaje','montaje','web','web','ipe','sostenibilidad'],
 ['digitalizacion','sistemas','ipe','redes','montaje','optativa'],
 ['web','sistemas','sistemas','montaje','redes','redes']];

const norm=s=>s.normalize('NFD').replace(/[\u0300-\u036f]/g,'').toLowerCase();
const segs=(d,b)=>{const r=[];for(let i=b*2;i<b*2+2;i++){const s=SCH[d][i],l=r[r.length-1];l&&l.s===s?l.b=i:r.push({s,a:i,b:i})}return r};
const hrs={};SCH.flat().forEach(s=>hrs[s]=(hrs[s]||0)+1);
const total=SCH.flat().length;
const slots=k=>DS.map((n,d)=>{const t=[];for(let b=0;b<3;b++)segs(d,b).forEach(g=>{if(g.s===k)t.push(S[g.a]+'-'+E[g.b])});return t.length?n+' '+t.join(', '):null}).filter(Boolean).join(' | ');
const WD={Mon:0,Tue:1,Wed:2,Thu:3,Fri:4,Sat:5,Sun:6};
const fmt=new Intl.DateTimeFormat('en-US',{timeZone:'Europe/Madrid',weekday:'short',hour:'numeric',minute:'numeric',hourCycle:'h23'});
function madrid(){const p={};fmt.formatToParts(new Date()).forEach(x=>p[x.type]=x.value);return{d:WD[p.weekday],m:(+p.hour)*60+(+p.minute)}}
const today=madrid().d;
const tc=d=>d===today?' today':'';

// Cabecera y cuerpo de la tabla
document.getElementById('thead').innerHTML='<th class="hr">Hora</th>'+DAYS.map((n,d)=>`<th class="day-col${tc(d)}" data-d="${d}">${n}</th>`).join('');
const card=(g,big)=>{const [full,short,t,h]=SUB[g.s];const [tf,ts]=TEACH[t];
 return `<div class="card${big?' big':''}" style="--h:${h}" data-s="${g.s}" data-a="${g.a}" data-b="${g.b}" data-q="${norm(full+' '+short+' '+tf+' '+ts)}" tabindex="0" role="button" aria-pressed="false">`+
 (big?'':`<div class="tm">${S[g.a]} - ${E[g.b]}</div>`)+`<b>${short}</b><div class="tc">${ts}</div></div>`};
const REC=['10:20 - 10:40|☕ Primer recreo (20 min)','12:30 - 12:40|🍪 Segundo recreo (10 min)'];
let rows='';
for(let b=0;b<3;b++){
 rows+=`<tr><td class="hr">${S[b*2]} - ${E[b*2+1]}</td>`+DAYS.map((_,d)=>{const s=segs(d,b);
  return `<td class="day-col${tc(d)}" data-d="${d}"><div class="stack">${s.map(g=>card(g,s.length===1)).join('')}</div></td>`}).join('')+'</tr>';
 if(REC[b]){const [t,l]=REC[b].split('|');rows+=`<tr class="rec" data-r="${b}"><td>${t}</td><td colspan="5">${l}</td></tr>`}
}
document.getElementById('tb').innerHTML=rows;

// Panel de profesorado (horas y % calculados)
document.getElementById('profs').innerHTML=Object.keys(TEACH).map(t=>{
 const ks=Object.keys(SUB).filter(k=>SUB[k][2]===t),h=ks.reduce((a,k)=>a+hrs[k],0);
 return `<details class="prof"><summary><div><b>${TEACH[t][0]}</b><small>${h} hrs semanales (${(h/total*100).toFixed(1)}%)</small></div>
 <svg width="12" height="12" viewBox="0 0 12 12" fill="none" stroke="currentColor" stroke-width="2"><path d="M2 4l4 4 4-4"/></svg></summary>
 <div class="pbody">${ks.map(k=>`<div class="card static" style="--h:${SUB[k][3]}"><b>${SUB[k][0]} (${hrs[k]}h)</b><div class="tc">${slots(k)}</div></div>`).join('')}</div></details>`}).join('');
document.getElementById('total').textContent=total+' horas/semana';

// Filtro por día
const F=document.getElementById('filters');
F.innerHTML=['Todos',...DAYS].map((n,i)=>`<button data-d="${i?i-1:'all'}" class="${i?'':'on'}" aria-pressed="${!i}">${n}</button>`).join('');
F.addEventListener('click',e=>{const b=e.target.closest('button');if(!b)return;
 F.querySelectorAll('button').forEach(x=>{x.classList.toggle('on',x===b);x.setAttribute('aria-pressed',x===b)});
 const d=b.dataset.d;
 document.querySelectorAll('.day-col').forEach(c=>c.style.display=(d==='all'||c.dataset.d===d)?'':'none');
 document.querySelectorAll('.rec td[colspan]').forEach(c=>c.colSpan=d==='all'?5:1)});

// Búsqueda + resaltado (un único estado, sin que se pisen)
let pin=null,hov=null,q='';
const tb=document.getElementById('tb');
function refresh(){const h=pin||hov;
 tb.querySelectorAll('.card').forEach(c=>{const s=c.dataset.s;
  c.classList.toggle('nm',!!q&&!c.dataset.q.includes(q));
  c.classList.toggle('ot',!!h&&s!==h);c.classList.toggle('hl',!!h&&s===h);
  c.setAttribute('aria-pressed',pin===s)})}
document.getElementById('q').addEventListener('input',e=>{q=norm(e.target.value.trim());refresh()});
tb.addEventListener('mouseover',e=>{const c=e.target.closest('.card');hov=c?c.dataset.s:null;refresh()});
tb.addEventListener('mouseleave',()=>{hov=null;refresh()});
tb.addEventListener('focusin',e=>{const c=e.target.closest('.card');hov=c?c.dataset.s:null;refresh()});
tb.addEventListener('focusout',()=>{hov=null;refresh()});
tb.addEventListener('click',e=>{const c=e.target.closest('.card');if(!c)return;pin=pin===c.dataset.s?null:c.dataset.s;refresh()});
tb.addEventListener('keydown',e=>{if((e.key==='Enter'||e.key===' ')&&e.target.classList.contains('card')){e.preventDefault();e.target.click()}});


// Clase actual según la hora de España (Europe/Madrid); fuera de horario no marca nada
const ST=[510,565,640,695,760,815],EN=[565,620,695,750,815,870],RC=[[620,640],[750,760]];
function markNow(){
 tb.querySelectorAll('.now').forEach(x=>x.classList.remove('now'));
 const {d,m}=madrid();if(d>4)return;
 const i=ST.findIndex((s,k)=>m>=s&&m<EN[k]);
 if(i>=0){const col=tb.querySelector(`td.day-col[data-d="${d}"]`&&`td.day-col[data-d="${d}"]`);
  tb.querySelectorAll(`td.day-col[data-d="${d}"] .card`).forEach(c=>{if(i>=+c.dataset.a&&i<=+c.dataset.b)c.classList.add('now')});return}
 RC.forEach((r,k)=>{if(m>=r[0]&&m<r[1]){const row=tb.querySelector(`.rec[data-r="${k}"]`);row&&row.classList.add('now')}})}
markNow();setInterval(markNow,30000);

// Tema claro/oscuro (usa su propio atributo data-mode para no chocar con el visor)
const root=document.documentElement;
let saved=null;try{saved=localStorage.getItem('theme')}catch(e){}
const setMode=m=>{root.dataset.mode=m;const bt=document.getElementById('themeBtn');bt.setAttribute('aria-pressed',m==='dark')};
setMode(saved||root.dataset.theme||(matchMedia('(prefers-color-scheme: dark)').matches?'dark':'light'));
document.getElementById('themeBtn').addEventListener('click',()=>{
 const m=root.dataset.mode==='dark'?'light':'dark';setMode(m);try{localStorage.setItem('theme',m)}catch(e){}});
// Al imprimir, siempre en claro
let prev;addEventListener('beforeprint',()=>{prev=root.dataset.mode;root.dataset.mode='light'});
addEventListener('afterprint',()=>{root.dataset.mode=prev});
</script>
</body>
</html>
